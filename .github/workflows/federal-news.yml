name: Federal News Scheduled Sync

on:
  workflow_dispatch:
  schedule:
    # Asia/Taipei 06:00, 11:50, 12:00, 18:00 (GitHub cron uses UTC).
    - cron: "0 22 * * *"
    - cron: "50 3 * * *"
    - cron: "0 4 * * *"
    - cron: "0 10 * * *"

concurrency:
  group: federal-news-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape-translate-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore translation cache
        uses: actions/cache@v4
        with:
          path: logs/translation_cache.sqlite3
          key: federal-translation-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            federal-translation-cache-${{ runner.os }}-

      - name: Validate Notion secrets
        shell: bash
        run: |
          test -n "$NOTION_API_KEY" || { echo "Missing NOTION_API_KEY"; exit 1; }
          test -n "$NOTION_DATABASE_ID" || { echo "Missing NOTION_DATABASE_ID"; exit 1; }

      - name: Scrape listings and translate titles
        run: python scraper.py --translate

      - name: Write new metadata to Notion
        run: python notion_sync.py --stage metadata

      - name: Fetch and translate content for newly created records only
        run: python scraper.py --content-keys data/notion-new-keys.json

      - name: Update content for newly created records
        run: python notion_sync.py --stage content --keys data/notion-new-keys.json

      - name: Upload run data and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: federal-news-${{ github.run_id }}
          path: data/*.json
          if-no-files-found: warn
          retention-days: 14



